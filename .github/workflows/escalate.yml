name: CivicFix SLA Auto-Escalation Check

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-sla-escalation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SLA Escalation API
        run: |
          API_URL="${{ secrets.API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="http://localhost:5000"
          fi
          
          echo "Triggering SLA escalation check at $API_URL/api/cron/escalate"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$API_URL/api/cron/escalate" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET || 'civicfix-cron-secret-demo-key' }}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Escalation check failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          
          echo "SLA Escalation check completed successfully."

name: CivicFix SLA Auto-Escalation Check

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-sla-escalation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SLA Escalation API
        run: |
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://civicfix.vercel.app"
          fi
          
          echo "Triggering SLA escalation check at $APP_URL/api/cron/escalate"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/cron/escalate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Escalation check failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          
          echo "SLA Escalation check completed successfully."
